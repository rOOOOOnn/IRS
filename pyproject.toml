[project]
name = "rmsc5003-irs-project"
version = "0.1.0"
description = "Data preparation framework for the CUHK RMSC5003 interest rate swap group project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irs_project"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
