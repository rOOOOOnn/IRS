project:
  name: RMSC5003 Interest Rate Swap Pricing and Risk Modelling
  currency: USD
  timezone: America/New_York

case_study:
  verified_facts:
    notional_usd: 10000000
    fixed_rate_decimal: 0.03356
    position: PAY_FIXED_RECEIVE_FLOATING
    floating_reference: COMPOUNDED_SOFR
    currency: USD
  research_assumptions:
    start_date: 2023-05-01
    maturity_month: 2028-05
    conventions_status: UNVERIFIED

data:
  raw_directory: data/raw/bloomberg
  interim_directory: data/interim
  processed_directory: data/processed
  report_directory: outputs/reports
  main_sample_start: 2018-04-02
  source: Bloomberg Excel export

splits:
  training: {start: 2018-04-02, end: 2021-12-31}
  validation: {start: 2022-01-03, end: 2023-04-28}
  inception_transition: {start: 2023-05-01, end: 2023-05-30}
  test: {start: 2023-05-31, end: null}

series:
  SOFRRATE:
    aliases: [SOFRRATE, SOFRRATE_INDEX]
    kind: SOFR_FIXING
    tenor: ON
    expected_unit: percent
  SOFRINDX:
    aliases: [SOFRINDX]
    kind: SOFR_INDEX
    tenor: INDEX
    expected_unit: index
  USOSFRA: {aliases: [USOSFRA], kind: OIS_PAR_RATE, tenor: 1M, expected_unit: percent}
  USOSFRC: {aliases: [USOSFRC], kind: OIS_PAR_RATE, tenor: 3M, expected_unit: percent}
  USOSFRF: {aliases: [USOSFRF], kind: OIS_PAR_RATE, tenor: 6M, expected_unit: percent}
  USOSFR1: {aliases: [USOSFR1], kind: OIS_PAR_RATE, tenor: 1Y, expected_unit: percent}
  USOSFR2: {aliases: [USOSFR2], kind: OIS_PAR_RATE, tenor: 2Y, expected_unit: percent}
  USOSFR3: {aliases: [USOSFR3], kind: OIS_PAR_RATE, tenor: 3Y, expected_unit: percent}
  USOSFR4: {aliases: [USOSFR4], kind: OIS_PAR_RATE, tenor: 4Y, expected_unit: percent}
  USOSFR5: {aliases: [USOSFR5], kind: OIS_PAR_RATE, tenor: 5Y, expected_unit: percent}
  USOSFR7: {aliases: [USOSFR7], kind: OIS_PAR_RATE, tenor: 7Y, expected_unit: percent}
  USOSFR10: {aliases: [USOSFR10], kind: OIS_PAR_RATE, tenor: 10Y, expected_unit: percent}
